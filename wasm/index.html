<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>wasm-todo</title>
    <style>
        :root { color-scheme: light dark; }
        body {
            display: grid;
            place-items: center;
            min-height: 100dvh;
            margin: 0;
            background: #f5f5f2;
            color: #71787f;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #16181a; color: #969ea5; }
        }
    </style>
</head>
<body>
    <p>Loading…</p>
    <script>
        navigator.serviceWorker.register('sw.js', { type: 'module' }).then(async () => {
            await navigator.serviceWorker.ready;
            // Wait until this page is controlled (clients.claim) before
            // navigating, so the app route is served by the worker.
            if (!navigator.serviceWorker.controller) {
                await new Promise(resolve => {
                    navigator.serviceWorker.addEventListener('controllerchange', resolve, { once: true });
                });
            }
            // This page also answers the host's 404 for an app route, so the
            // path that was asked for is the path to hand to the worker.
            if (location.pathname.endsWith('/')) {
                location.replace('./todos');

                return;
            }

            location.reload();
        });
    </script>
</body>
</html>
